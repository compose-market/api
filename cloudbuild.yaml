# Cloud Build configuration for compose-market-api
# Usage: gcloud builds submit --config=cloudbuild.yaml .
# Or trigger automatically via Cloud Build triggers

substitutions:
  _REGION: us-east1
  _SERVICE_NAME: compose-market-api
  _REPO_NAME: compose
  _SERVICE_ACCOUNT: compose-api@gen-lang-client-0035632562.iam.gserviceaccount.com

steps:
  # Build container image with Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '--platform'
      - 'linux/amd64'
      - '.'
    waitFor: ['-']

  # Push images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}']
    waitFor: ['build']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-service'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy ${_SERVICE_NAME} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA \
          --region ${_REGION} \
          --platform managed \
          --service-account ${_SERVICE_ACCOUNT} \
          --allow-unauthenticated \
          --port 3000 \
          --cpu 2 \
          --no-cpu-throttling \
          --memory 4Gi \
          --min-instances 1 \
          --max-instances 10 \
          --timeout 300 \
          --set-env-vars "NODE_ENV=production,BATCH_SETTLEMENT_IDLE_SECONDS=0" \
          --set-secrets "
          GOOGLE_CLOUD_PROJECT_ID=GOOGLE_CLOUD_PROJECT_ID:latest,
          VERTEX_PROJECT_ID=VERTEX_PROJECT_ID:latest,
          DISPENSER_CONTRACT=DISPENSER_CONTRACT:latest,
          AVALANCHE_FUJI_CHAIN_ID=AVALANCHE_FUJI_CHAIN_ID:latest,
          AVALANCHE_FUJI_RPC=AVALANCHE_FUJI_RPC:latest,
          AVALANCHE_MAINNET_RPC=AVALANCHE_MAINNET_RPC:latest,
          ARBITRUM_SEPOLIA_RPC=ARBITRUM_SEPOLIA_RPC:latest,
          ARBITRUM_MAINNET_RPC=ARBITRUM_MAINNET_RPC:latest,
          ARC_TESTNET_RPC=ARC_TESTNET_RPC:latest,
          ARC_MAINNET_RPC=ARC_MAINNET_RPC:latest,
          SEI_TESTNET_RPC=SEI_TESTNET_RPC:latest,
          SEI_MAINNET_RPC=SEI_MAINNET_RPC:latest,
          SOLANA_DEVNET_RPC=SOLANA_DEVNET_RPC:latest,
          SOLANA_MAINNET_RPC=SOLANA_MAINNET_RPC:latest,
          API_URL=API_URL:latest,
          RUNTIME_URL=RUNTIME_URL:latest,
          CONNECTOR_URL=CONNECTOR_URL:latest,
          EXPORTER_URL=EXPORTER_URL:latest,
          METRICS_DATABASE_URL=METRICS_DATABASE_URL:latest,
          USER_DATABASE_URL=USER_DATABASE_URL:latest,
          PINATA_GATEWAY_URL=PINATA_GATEWAY_URL:latest,
          TEMPORAL_ADDRESS=TEMPORAL_ADDRESS:latest,
          TEMPORAL_NAMESPACE=TEMPORAL_NAMESPACE:latest,
          VALKEY_KEYS_SERVICE_URI=VALKEY_KEYS_SERVICE_URI:latest,
          VALKEY_TLS=VALKEY_TLS:latest,
          IP_ACCESS=IP_ACCESS:latest,
          THIRDWEB_CLIENT_ID=THIRDWEB_CLIENT_ID:latest,
          MERCHANT_WALLET_ADDRESS=MERCHANT_WALLET_ADDRESS:latest,
          SVM_MERCHANT_WALLET_ADDRESS=SVM_MERCHANT_WALLET_ADDRESS:latest,
          THIRDWEB_SERVER_WALLET_ADDRESS=THIRDWEB_SERVER_WALLET_ADDRESS:latest,
          TREASURY_SERVER_WALLET_PUBLIC=TREASURY_SERVER_WALLET_PUBLIC:latest,
          SVM_TREASURY_SERVER_WALLET_PUBLIC=SVM_TREASURY_SERVER_WALLET_PUBLIC:latest,
          CF_ACCOUNT_ID=CF_ACCOUNT_ID:latest,
          CF_EMBEDDING_MODEL=CF_EMBEDDING_MODEL:latest,
          TG_BOT_USERNAME=TG_BOT_USERNAME:latest,
          THIRDWEB_SECRET_KEY=THIRDWEB_SECRET_KEY:latest,
          PINATA_API_Key=PINATA_API_Key:latest,
          PINATA_API_SECRET=PINATA_API_SECRET:latest,
          PINATA_JWT=PINATA_JWT:latest,
          VERTEX_AI_API_KEY=VERTEX_AI_API_KEY:latest,
          GOOGLE_GENERATIVE_AI_API_KEY=GOOGLE_GENERATIVE_AI_API_KEY:latest,
          OPENAI_API_KEY=OPENAI_API_KEY:latest,
          ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,
          ASI_ONE_API_KEY=ASI_ONE_API_KEY:latest,
          ASI_INFERENCE_API_KEY=ASI_INFERENCE_API_KEY:latest,
          OPEN_ROUTER_API_KEY=OPEN_ROUTER_API_KEY:latest,
          AI_ML_API_KEY=AI_ML_API_KEY:latest,
          HUGGING_FACE_INFERENCE_TOKEN=HUGGING_FACE_INFERENCE_TOKEN:latest,
          FAL_API_KEY=FAL_API_KEY:latest,
          LYRIA_REALTIME_API_KEY=LYRIA_REALTIME_API_KEY:latest,
          FIREWORKS_API_KEY=FIREWORKS_API_KEY:latest,
          MONGO_DB_API_KEY=MONGO_DB_API_KEY:latest,
          DEEPGRAM_API_KEY=DEEPGRAM_API_KEY:latest,
          PERPLEXITY_API_KEY=PERPLEXITY_API_KEY:latest,
          CHAIN_GPT_SECRET_KEY=CHAIN_GPT_SECRET_KEY:latest,
          AGENTVERSE_API_KEY=AGENTVERSE_API_KEY:latest,
          LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest,
          TEMPORAL_API_KEY=TEMPORAL_API_KEY:latest,
          GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,
          COMPOSIO_API_KEY=COMPOSIO_API_KEY:latest,
          COMPOSE_BOT_HTTP_API=COMPOSE_BOT_HTTP_API:latest,
          FACILITATOR_KEY=FACILITATOR_KEY:latest,
          SVM_FACILITATOR_KEY=SVM_FACILITATOR_KEY:latest,
          SERVER_WALLET_KEY=SERVER_WALLET_KEY:latest,
          VALKEY_KEYS_PASSWORD=VALKEY_KEYS_PASSWORD:latest,
          COMPOSE_SESSION_SECRET=COMPOSE_SESSION_SECRET:latest,
          CF_API_TOKEN=CF_API_TOKEN:latest,
          TEMPORAL_ALEX_API_KEY=TEMPORAL_ALEX_API_KEY:latest"
    waitFor: ['push']

  # Update Cloud Run Jobs
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-jobs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Batch Settlement Job
        gcloud run jobs update compose-market-settlement \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA \
          --region ${_REGION} \
          --tasks 1 \
          --max-retries 0 \
          --task-timeout 600s \
          --service-account ${_SERVICE_ACCOUNT} \
          --set-env-vars "JOB_TASK=batch-settlement,NODE_ENV=production,BATCH_SETTLEMENT_IDLE_SECONDS=0" \
          --set-secrets "GOOGLE_CLOUD_PROJECT_ID=GOOGLE_CLOUD_PROJECT_ID:latest,
          VERTEX_PROJECT_ID=VERTEX_PROJECT_ID:latest,
          DISPENSER_CONTRACT=DISPENSER_CONTRACT:latest,
          AVALANCHE_FUJI_RPC=AVALANCHE_FUJI_RPC:latest,
          AVALANCHE_FUJI_CHAIN_ID=AVALANCHE_FUJI_CHAIN_ID:latest,
          AVALANCHE_MAINNET_RPC=AVALANCHE_MAINNET_RPC:latest,
          ARBITRUM_SEPOLIA_RPC=ARBITRUM_SEPOLIA_RPC:latest,
          ARBITRUM_MAINNET_RPC=ARBITRUM_MAINNET_RPC:latest,
          ARC_TESTNET_RPC=ARC_TESTNET_RPC:latest,
          ARC_MAINNET_RPC=ARC_MAINNET_RPC:latest,
          SEI_TESTNET_RPC=SEI_TESTNET_RPC:latest,
          SEI_MAINNET_RPC=SEI_MAINNET_RPC:latest,
          SOLANA_DEVNET_RPC=SOLANA_DEVNET_RPC:latest,
          SOLANA_MAINNET_RPC=SOLANA_MAINNET_RPC:latest,
          MERCHANT_WALLET_ADDRESS=MERCHANT_WALLET_ADDRESS:latest,
          SVM_MERCHANT_WALLET_ADDRESS=SVM_MERCHANT_WALLET_ADDRESS:latest,
          ANALYTICS_DATABASE_URL=ANALYTICS_DATABASE_URL:latest,
          VALKEY_TLS=VALKEY_TLS:latest,
          VALKEY_KEYS_SERVICE_URI=VALKEY_KEYS_SERVICE_URI:latest,
          SERVER_WALLET_KEY=SERVER_WALLET_KEY:latest,
          FACILITATOR_KEY=FACILITATOR_KEY:latest,
          SVM_FACILITATOR_KEY=SVM_FACILITATOR_KEY:latest,
          VALKEY_KEYS_PASSWORD=VALKEY_KEYS_PASSWORD:latest" 2>/dev/null || \
        gcloud run jobs create compose-market-settlement \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA \
          --region ${_REGION} \
          --tasks 1 \
          --max-retries 0 \
          --task-timeout 600s \
          --service-account ${_SERVICE_ACCOUNT} \
          --set-env-vars "JOB_TASK=batch-settlement,NODE_ENV=production,BATCH_SETTLEMENT_IDLE_SECONDS=0" \
          --set-secrets "GOOGLE_CLOUD_PROJECT_ID=GOOGLE_CLOUD_PROJECT_ID:latest,
          VERTEX_PROJECT_ID=VERTEX_PROJECT_ID:latest,
          DISPENSER_CONTRACT=DISPENSER_CONTRACT:latest,
          AVALANCHE_FUJI_RPC=AVALANCHE_FUJI_RPC:latest,
          AVALANCHE_FUJI_CHAIN_ID=AVALANCHE_FUJI_CHAIN_ID:latest,
          AVALANCHE_MAINNET_RPC=AVALANCHE_MAINNET_RPC:latest,
          ARBITRUM_SEPOLIA_RPC=ARBITRUM_SEPOLIA_RPC:latest,
          ARBITRUM_MAINNET_RPC=ARBITRUM_MAINNET_RPC:latest,
          ARC_TESTNET_RPC=ARC_TESTNET_RPC:latest,
          ARC_MAINNET_RPC=ARC_MAINNET_RPC:latest,
          SEI_TESTNET_RPC=SEI_TESTNET_RPC:latest,
          SEI_MAINNET_RPC=SEI_MAINNET_RPC:latest,
          SOLANA_DEVNET_RPC=SOLANA_DEVNET_RPC:latest,
          SOLANA_MAINNET_RPC=SOLANA_MAINNET_RPC:latest,
          MERCHANT_WALLET_ADDRESS=MERCHANT_WALLET_ADDRESS:latest,
          SVM_MERCHANT_WALLET_ADDRESS=SVM_MERCHANT_WALLET_ADDRESS:latest,
          ANALYTICS_DATABASE_URL=ANALYTICS_DATABASE_URL:latest,
          VALKEY_TLS=VALKEY_TLS:latest,
          VALKEY_KEYS_SERVICE_URI=VALKEY_KEYS_SERVICE_URI:latest,
          SERVER_WALLET_KEY=SERVER_WALLET_KEY:latest,
          FACILITATOR_KEY=FACILITATOR_KEY:latest,
          SVM_FACILITATOR_KEY=SVM_FACILITATOR_KEY:latest,
          VALKEY_KEYS_PASSWORD=VALKEY_KEYS_PASSWORD:latest"

        # Expiry Scan Job
        gcloud run jobs update compose-market-expiry \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA \
          --region ${_REGION} \
          --tasks 1 \
          --max-retries 0 \
          --task-timeout 300s \
          --service-account ${_SERVICE_ACCOUNT} \
          --set-env-vars "JOB_TASK=expiry-scan,NODE_ENV=production" \
          --set-secrets "VALKEY_KEYS_SERVICE_URI=VALKEY_KEYS_SERVICE_URI:latest,
          VALKEY_KEYS_PASSWORD=VALKEY_KEYS_PASSWORD:latest,
          VALKEY_TLS=VALKEY_TLS:latest" 2>/dev/null || \
        gcloud run jobs create compose-market-expiry \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA \
          --region ${_REGION} \
          --tasks 1 \
          --max-retries 0 \
          --task-timeout 300s \
          --service-account ${_SERVICE_ACCOUNT} \
          --set-env-vars "JOB_TASK=expiry-scan,NODE_ENV=production" \
          --set-secrets "VALKEY_KEYS_SERVICE_URI=VALKEY_KEYS_SERVICE_URI:latest,
          VALKEY_KEYS_PASSWORD=VALKEY_KEYS_PASSWORD:latest,
          VALKEY_TLS=VALKEY_TLS:latest"

        # Batch settlement scheduler: every 2 minutes, triggers the existing Cloud Run Job.
        gcloud services enable cloudscheduler.googleapis.com --project $PROJECT_ID --quiet
        gcloud projects add-iam-policy-binding $PROJECT_ID \
          --member="serviceAccount:${_SERVICE_ACCOUNT}" \
          --role="roles/run.invoker" >/dev/null 2>&1 || true
        PROJECT_NUMBER="$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')"

        METRICS_SECRETS="METRICS_DATABASE_URL=METRICS_DATABASE_URL:latest,MERCHANT_WALLET_ADDRESS=MERCHANT_WALLET_ADDRESS:latest,SVM_MERCHANT_WALLET_ADDRESS=SVM_MERCHANT_WALLET_ADDRESS:latest,VALKEY_KEYS_SERVICE_URI=VALKEY_KEYS_SERVICE_URI:latest,VALKEY_TLS=VALKEY_TLS:latest,VALKEY_KEYS_PASSWORD=VALKEY_KEYS_PASSWORD:latest,AVALANCHE_FUJI_RPC=AVALANCHE_FUJI_RPC:latest,AVALANCHE_MAINNET_RPC=AVALANCHE_MAINNET_RPC:latest,ARBITRUM_SEPOLIA_RPC=ARBITRUM_SEPOLIA_RPC:latest,ARBITRUM_MAINNET_RPC=ARBITRUM_MAINNET_RPC:latest,BASE_SEPOLIA_RPC=BASE_SEPOLIA_RPC:latest,BASE_MAINNET_RPC=BASE_MAINNET_RPC:latest,OPENAI_ADMIN_KEY=OPENAI_ADMIN_KEY:latest,FIREWORKS_API_KEY=FIREWORKS_API_KEY:latest,FIREWORKS_ID=FIREWORKS_ID:latest,AZURE_SUBSCRIPTION_ID=AZURE_SUBSCRIPTION_ID:latest"

        deploy_metric_job() {
          local name="$1" task="$2" timeout="$3"
          gcloud run jobs update "${name}" \
            --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA \
            --region ${_REGION} \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout "${timeout}" \
            --service-account ${_SERVICE_ACCOUNT} \
            --set-env-vars "JOB_TASK=${task},NODE_ENV=production" \
            --set-secrets "${METRICS_SECRETS}" 2>/dev/null || \
          gcloud run jobs create "${name}" \
            --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA \
            --region ${_REGION} \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout "${timeout}" \
            --service-account ${_SERVICE_ACCOUNT} \
            --set-env-vars "JOB_TASK=${task},NODE_ENV=production" \
            --set-secrets "${METRICS_SECRETS}"
        }

        deploy_metric_scheduler() {
          local name="$1" schedule="$2" job_name="$3"
          local URI="https://${_REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_NUMBER}/jobs/${job_name}:run"
          if gcloud scheduler jobs describe "${name}" --location ${_REGION} --project $PROJECT_ID >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${name}" --location ${_REGION} --project $PROJECT_ID --schedule "${schedule}" --time-zone "Etc/UTC" --uri "${URI}" --http-method POST --oauth-service-account-email ${_SERVICE_ACCOUNT} --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" --attempt-deadline 300s --quiet
          else
            gcloud scheduler jobs create http "${name}" --location ${_REGION} --project $PROJECT_ID --schedule "${schedule}" --time-zone "Etc/UTC" --uri "${URI}" --http-method POST --oauth-service-account-email ${_SERVICE_ACCOUNT} --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" --attempt-deadline 300s --quiet
          fi
        }

        SETTLEMENT_URI="https://${_REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_NUMBER}/jobs/compose-market-settlement:run"
        if gcloud scheduler jobs describe compose-market-settlement-every-2-min \
          --location ${_REGION} \
          --project $PROJECT_ID >/dev/null 2>&1; then
          gcloud scheduler jobs update http compose-market-settlement-every-2-min \
            --location ${_REGION} \
            --project $PROJECT_ID \
            --schedule "*/2 * * * *" \
            --time-zone "Etc/UTC" \
            --uri "${SETTLEMENT_URI}" \
            --http-method POST \
            --oauth-service-account-email ${_SERVICE_ACCOUNT} \
            --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
            --attempt-deadline 180s \
            --quiet
        else
          gcloud scheduler jobs create http compose-market-settlement-every-2-min \
            --location ${_REGION} \
            --project $PROJECT_ID \
            --schedule "*/2 * * * *" \
            --time-zone "Etc/UTC" \
            --uri "${SETTLEMENT_URI}" \
            --http-method POST \
            --oauth-service-account-email ${_SERVICE_ACCOUNT} \
            --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
            --attempt-deadline 180s \
            --quiet
        fi

        deploy_metric_job "compose-market-metrics-payments" "metrics-payments" "120s"
        deploy_metric_job "compose-market-metrics-sessions" "metrics-sessions" "120s"
        deploy_metric_job "compose-market-metrics-downloads" "metrics-downloads" "120s"
        deploy_metric_job "compose-market-metrics-sync" "metrics-sync" "300s"
        deploy_metric_job "compose-market-metrics-expenses" "metrics-expenses" "300s"

        deploy_metric_scheduler "compose-market-metrics-payments-every-2-min" "*/2 * * * *" "compose-market-metrics-payments"
        deploy_metric_scheduler "compose-market-metrics-sessions-every-5-min" "*/5 * * * *" "compose-market-metrics-sessions"
        deploy_metric_scheduler "compose-market-metrics-downloads-hourly" "0 * * * *" "compose-market-metrics-downloads"
        deploy_metric_scheduler "compose-market-metrics-sync-every-15-min" "*/15 * * * *" "compose-market-metrics-sync"
        deploy_metric_scheduler "compose-market-metrics-expenses-hourly" "0 * * * *" "compose-market-metrics-expenses"
    waitFor: ['deploy-service']

# Output the service URL
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Build timeout
timeout: '1800s'

# Images to be pushed
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest'
